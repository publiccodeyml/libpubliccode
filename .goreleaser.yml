# This is an example goreleaser.yaml file with some sane defaults.
# Make sure to check the documentation at http://goreleaser.com
version: 2
project_name: publiccode-parser

before:
  hooks:
    - go mod download
    - go generate ./...
builds:
-
  id: publiccode-parser
  binary: publiccode-parser
  main: ./publiccode-parser
  flags:
    - -trimpath
  ldflags:
    - -s -w -buildid=
  env:
    - CGO_ENABLED=0
    - SOURCE_DATE_EPOCH={{.CommitTimestamp}}
  goos:
    - linux
    - darwin
    - windows

archives:
  - formats: [tar.gz]
    # this name template makes the OS and Arch compatible with the results of `uname`.
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    # use zip for windows archives
    format_overrides:
      - goos: windows
        formats: [zip]

sboms:
  - id: archive
    artifacts: archive
  - id: source
    artifacts: source

checksum:
  name_template: 'checksums.txt'
snapshot:
  version_template: "{{ .Tag }}-next"
changelog:
  sort: asc
  filters:
    exclude:
      - '^chore'
      - '^test'
      - '^Merge'
dockers_v2:
  - id: publiccode-parser
    ids: [publiccode-parser]
    dockerfile: Dockerfile.goreleaser
    images: [publiccodeyml/libpubliccode]
    tags:
      - "{{ .Tag }}"
      - latest
    platforms:
      - linux/amd64
      - linux/arm64
    flags: ["--pull"]
    labels:
      org.opencontainers.image.source: https://github.com/publiccodeyml/libpubliccode

  # Keep the architecture tags used by existing consumers.
  # Snapshots already add architecture suffixes to the tags above.
  - id: publiccode-parser-amd64
    ids: [publiccode-parser]
    dockerfile: Dockerfile.goreleaser
    images: [publiccodeyml/libpubliccode]
    tags: ["{{ .Tag }}-amd64"]
    platforms: [linux/amd64]
    disable: "{{ .IsSnapshot }}"
    flags: ["--pull"]
    labels:
      org.opencontainers.image.source: https://github.com/publiccodeyml/libpubliccode
  - id: publiccode-parser-arm64
    ids: [publiccode-parser]
    dockerfile: Dockerfile.goreleaser
    images: [publiccodeyml/libpubliccode]
    tags: ["{{ .Tag }}-arm64"]
    platforms: [linux/arm64]
    disable: "{{ .IsSnapshot }}"
    flags: ["--pull"]
    labels:
      org.opencontainers.image.source: https://github.com/publiccodeyml/libpubliccode
